        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #222;
                color: white;
                font-family: monospace;
            }
            h1 {
                margin: 0 0 12px;
            }
            #info {
                width: 330px;
                display: flex;
                justify-content: space-between;
                margin-bottom: 10px;
            }

            #board {
                display: grid;
                grid-template-columns: repeat(10, 32px);
                gap: 2px;
            }

            .cell {
                width: 32px;
                height: 32px;
                padding: 0;
                border: 1px solid #555;
                background: #777;
                color: white;
                font: bold 16px monospace;
                cursor: pointer;
            }
            .cell:hover {
                background: #999;
            }
            .open {
                background: #bbb;
                color: #111;
            }
            .mine {
                background: #d33;
            }

            .flag {
                color : #ffd33d;
            }
            #restart {
                margin-top: 14px;
                padding: 7px 18px;
                border: 0;
                background: #ddd;
                cursor: pointer;
            }
            #message {
                height: 18px;
                margin: 10px 0 0;
            }
        </style>
    </head>

    <body>
        <h1>Minesweeper</h1>
        <div id="info">
            <span>Mines: <b id="mineCount">10</b></span>
            <span>Flags: <b id="flagCount">0</b></span>
        </div>

        <div id="board"></div>
        <button id="restart">New Game</button>

        <p id="message"></p>

        <script>
            const size = 10;
            const mineTotal = 10;
            const board = document.querySelector("#board");
            const mineCount = document.querySelector("#mineCount");
            const flagCount = document.querySelector("#flagCount");
            const message = document.querySelector("#message");
            const restart = document.querySelector("#restart")

            let cells = [];
            let flags = 0;
            let gameOver = false;
            let audio;
            
            function startAudio() {
                audio ??= new AudioContext();
                audio.resume()
            }

            function clickSound() {
                startAudio()

                const o = audio.createOscillator();
                const g = audio.createGain();
                o.type = "sine";
                o.frequency.value = 500;
                g.gain.setValueAtTime(0.08, audio.currentTime);
                g.gain.exponentialRampToValueAtTime(
                    0.001,
                    audio.currentTime + 0.08
                );
                o.connect(g);
                g.connect(audio.destination);
                o.start();
                o.stop(audio.currentTime + 0.08);
            }

            function bombSound() {
                startAudio();
                const o = audio.createOscillator();
                const g = audio.createGain();

                o.type = "sawtooth";
                o.frequency.setValueAtTime(140, audio.currentTime);
                o.frequency.exponentialRampToValueAtTime(
                    40,
                    audio.currentTime + 0.5
                );
                o.connect(g);
                g.connect(audio.destination);
                o.start();
                o.stop(audio.currentTime + 0.5);
            }

            function newGame() {
                board.innerHTML = "";
                cells = [];
                flags = 0;
                gameOver = false;
                mineCount.textContent = mineTotal;
                flagCount.textContent = 0;
                message.textContent = "";

                for (let i = 0;i < size * size; i++){
                    const button = document.createElement("button");
                    button.className = "cell";
                    button.onclick = function() {
                        openCell(i);
                    };
                    button.oncontextmenu = function(event) {
                        event.preventDefault();
                        toggleFlag(i);
                    };
                    board.appendChild(button);
                    cells.push({});
                }
                placeMines();
                calculateNumbers();
            }
            function placeMines() {
                for (let p = 0; p < mineTotal;){
                    const r = Math.random() * cells.length | 0;
                    if (!cells[r].mine) cells[r].mine = ++p;
                }
            }
            function neighbors(index) {
                const result = [];
                const row = Math.floor(index / size);
                const column = index % size;
                for(let y = -1; y <= 1;y++){
                    for(let x = -1; x <= 1;x++){
                        const r = row + y, c = column + x;
                        if ((x || y) && r >= 0 && r < size && c >= 0 && c < size) result.push(r * size + c);
                    }
                }
                return result;
            }
            function calculateNumbers() {
               cells.forEach((c , i) => c.number = neighbors(i).filter(j => cells[j].mine).length);
            }
            function openCell(index) {
               const cell = cells[index];
               if ( gameOver || cell.open || cell.flag ) return;
               if (cell.mine) return lose();
               clickSound();
               reveal(index);
               checkWin();
            }
            function reveal(index) {
                const cell = cells[index];
                if (cell.open || cell.flag || cell.mine) return;
                cell.open = true;
                const button = board.children[index];
                button.classList.add("open");
                if(cell.number) button.textContent = cell.number;
                else neighbors(index).forEach(reveal);
            }
            function toggleFlag(index) {
                const cell = cells[index];
                if(gameOver || cell.open || (!cell.flag && flags >= mineTotal)) return;
                cell.flag = !cell.flag;
                flags += cell.flag ? 1 : -1;
                const button = board.children[index];
                button.textContent = cell.flag ? "F" : "";
                button.classList.toggle("flag", cell.flag);
                flagCount.textContent = flags;
            }
            function lose() {
                gameOver = true;
                bombSound();
                message.textContent = "Game Over!!!";
                cells.forEach((c, i) => c.mine && (board.children[i].textContent = "B", board.children[i].classList.add("mine")));
            }
            function checkWin() {
                if(cells.some(c => !c.mine && !c.open)) return;
                gameOver = true;
                message.textContent = "You Win!!!";
            }
            restart.onclick = newGame;
            newGame();
        </script>
    </body>
