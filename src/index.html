<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Compact Minesweeper</title>

        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #222;
                color: white;
                font-family: monospace;
            }
            h1 {
                margin: 0 0 12px;
            }
            #info {
                width: 330px;
                display: flex;
                justify-content: space-between;
                margin-bottom: 10px;
            }

            #board {
                display: grid;
                grid-template-columns: repeat(10, 32px);
                gap: 2px;
            }

            .cell {
                width: 32px;
                height: 32px;
                padding: 0;
                border: 1px solid #555;
                background: #777;
                color: white;
                font: bold 16px monospace;
                cursor: pointer;
            }
            .cell:hover {
                background: #999;
            }
            .open {
                background: #bbb;
                color: #111;
            }
            .mine {
                background: #d33;
            }

            .flag {
                color : #ffd33d;
            }
            #restart {
                margin-top: 14px;
                padding: 7px 18px;
                border: 0;
                background: #ddd;
                cursor: pointer;
            }
            #message {
                height: 18px;
                margin: 10px 0 0;
            }
        </style>
    </head>

    <body>
        <h1>Minesweeper</h1>
        <div id="info">
            <span>Mines: <b id="mineCount">10</b></span>
            <span>Flags: <b id="flagCount">0</b></span>
        </div>

        <div id="board"></div>
        <button id="restart">New Game</button>

        <p id="message"></p>

        <script>
            const size = 10;
            const mineTotal = 10;
            const board = document.querySelector("#board");
            const mineCount = document.querySelector("#minecount");
            const flagCount = document.querySelector("#flagcount");
            const message = document.querySelector("#message");
            const restart = document.querySelector("#restart")

            let cells = [];
            let flags = 0;
            let gameOver = false;
            let audio;
            
            function startAudio() {
                if (!audio) {
                    audio = new (AudioContext || webkitAudioContext)();
                }
                if (audio.state == "suspended") {
                    audio.resume()
                }
            }

            function clickSound() {
                startAudio()

                const o = audio.createOscillator();
                const g = audio.createGain();
                o.type = "sine";
                o.frequency.value = 500;
                g.gain.setValueAtTime(0.08, audio.currentTime);
                g.gain.exponentialRampToValueAtTime(
                    0.001,
                    audio.currentTime + 0.08
                );
                o.connect(g);
                g.connect(audio.destination);
                o.start();
                o.stop(audio.currentTime + 0.08);
            }

            function bombSound() {
                startAudio();
                const o = audio.createOscillator();
                const g = audio.createGain();

                o.type = "sawtooth";
                o.frequency.setValueAtTime(140, audio.currentTime);
                o.frequency.exponentialRampToValueAtTime(
                    40,
                    audio.currentTime + 0.5
                );
                o.connect(g);
                g.connect(audio.destination);
                o.start();
                o.stop(audio.currentTime + 0.5);
            }

            function newGame() {
                board.innerHTML = "";
                cells = [];
                flags = 0;
                gameOver = false;
                mineCount.textContent = mineTotal;
                flagCount.textContent = 0;
                message.textContent = "";

                for (let i = 0;i < size * size; i++){
                    const button = document.createElement("button");
                    button.className = "cell";
                    button.onclick = function() {
                        openCell(i);
                    };
                    button.oncontextmenu = function(event) {
                        event.preventDefault();
                        toggleFlag(i);
                    };
                    board.appendChild(button);
                    cells.push({
                        mine : false,
                        open : false,
                        flag : false,
                        number : 0
                    });
                }
                placeMines();
                calculateNumbers();
            }

            function placeMines() {
                let placed = 0;
                while (placed < mineTotal) {
                    const random = Math.floor(Math.random() * cells.length);

                    if(!cells[random].mine){
                        cells[random].mine = true;
                        placed++;
                    }
                }
            }

            function neighbors(index) {
                const result = [];
                const row = Math.floor(index / size);
                const column = index % size;

                for (let y = -1; y <= 1;y++){
                    for(let x = -1; x <= 1; x++){
                        if(x == 0 && y == 0){
                            continue;
                        }
                        const newRow = row + y;
                        const newColumn = column + x;

                        if (
                            newRow >= 0 &&
                            newRow < size &&
                            newColumn >= 0 &&
                            newColumn < size
                        ) {
                            result.push(newRow * size + newColumn);
                        }
                    }
                }
                return result;
            }

            function calculateNumbers() {
                for(let i = 0; i < cells.length;i++){
                    if(cells[i].mine) {
                        continue;
                    }
                    const around = neighbors(i);
                    let count = 0;
                    for(let j = 0;j < around.length;j++){
                        if(cells[around[j]].mine){
                            count++;
                        }
                    }
                    cells[i].number = count;
                }
            }

            

        </script>
    </body>
</html>
